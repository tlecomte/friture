[build-system]
requires = [
    "Cython>=3.2.9",
    "numpy>=2.5.1",
    "setuptools>=83.0.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "friture"
description = "Visualizes audio data in real-time"
license = {file = "COPYING.txt"}
readme = "README.rst"
authors = [
    {name = "Timothée Lecomte", email = "contact@friture.org"}
]
keywords = ["audio", "spectrum", "spectrogram"]
classifiers=[
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Speech"
]
dynamic = ["version"]
requires-python = ">=3.14"
dependencies = [
    "docutils",
    "numpy",
    "pa_ringbuffer",
    "platformdirs",
    "PyQt6",
    "pyinstaller",
    "pyrr",
    "rtmixer",
    "sounddevice"
]

[project.scripts]
friture = "friture.analyzer:main"

[project.urls]
Homepage = "http://www.friture.org"
Repository = "https://github.com/tlecomte/friture"
Issues = "https://github.com/tlecomte/friture/issues"

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]

[dependency-groups]
dev = [
    "mypy",
    "pytest"
]

[tool.pytest.ini_options]
testpaths = ["friture/test"]
python_files = ["test_*.py"]

[tool.setuptools]
packages=[
    "friture",
    "friture.playback",
    "friture.plotting",
    "friture.generators",
    "friture.signal",
    "friture_extensions"
]

[tool.setuptools.data-files]
"share/applications" = ["appimage/friture.desktop"]

[tool.setuptools.dynamic]
version = {attr = "friture.__version__"}
