[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
name = "friture"
description = "Real-time visualization of live audio data"
license = {file = "COPYING.txt"}
readme = "README.rst"
authors = [
    {name = "Timothée Lecomte", email = "contact@friture.org"},
]
keywords = ["audio", "spectrum", "spectrogram"]
classifiers=[
    "Programming Language :: Python",
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Speech"
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "sounddevice==0.5.5",
    "rtmixer==0.1.7",
    "docutils==0.23",
    "numpy==2.4.6",
    "PyQt6",
    "platformdirs==4.11.0",
    "pyrr==0.10.3",
    "pyinstaller==6.21.0"
]

[project.scripts]
friture = "friture.analyzer:main"

[project.urls]
Homepage = "http://www.friture.org"
Repository = "https://github.com/tlecomte/friture"
Issues = "https://github.com/tlecomte/friture/issues"

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["friture/test"]
python_files = ["test_*.py"]

[tool.setuptools]
packages=[
    "friture",
    "friture.data",
    "friture.playback",
    "friture.plotting",
    "friture.generators",
    "friture.signal",
]

[tool.setuptools.data-files]
"share/applications" = ["appimage/friture.desktop"]

[tool.setuptools.dynamic]
version = {attr = "friture.__version__"}